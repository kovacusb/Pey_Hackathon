<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paga Fácil · pruebas</title>
<style>
  :root { --fondo:#efeae2; --burbuja:#fff; --mia:#d9fdd3; --texto:#111b21; --sutil:#667781; --acento:#00a884; --borde:#d1d7db; --panel:#f0f2f5; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--texto); background:var(--panel); }
  .app { display:grid; grid-template-columns: 1fr 280px; height:100vh; max-width:1100px; margin:0 auto; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; height:auto; } aside { order:-1; } }
  header { background:var(--acento); color:#fff; padding:12px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header b { flex:1; }
  header input { width:140px; padding:6px 8px; border-radius:6px; border:0; }
  main { display:flex; flex-direction:column; min-height:0; height:100vh; }
  @media (max-width: 760px) { main { height:80vh; } }
  #chat { flex:1; overflow-y:auto; padding:16px; background:var(--fondo); display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:85%; background:var(--burbuja); padding:8px 10px; border-radius:8px; white-space:pre-wrap; box-shadow:0 1px .5px rgba(0,0,0,.13); }
  .msg.mia { align-self:flex-end; background:var(--mia); }
  .msg .enc { font-weight:700; margin-bottom:4px; }
  .msg .pie { color:var(--sutil); font-size:12px; margin-top:4px; }
  .msg img { max-width:240px; display:block; border-radius:6px; }
  .acciones { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
  .acciones button { background:#fff; border:1px solid var(--borde); color:#027eb5; padding:8px; border-radius:6px; cursor:pointer; font:inherit; text-align:center; }
  .acciones button:hover { background:#f5f6f6; }
  .fila { text-align:left !important; }
  .fila small { display:block; color:var(--sutil); }
  .lista-titulo { color:var(--sutil); font-size:12px; margin-top:6px; }
  form { display:flex; gap:8px; padding:10px; background:var(--panel); }
  form input { flex:1; padding:10px 12px; border-radius:20px; border:1px solid var(--borde); font:inherit; }
  form button { background:var(--acento); color:#fff; border:0; border-radius:20px; padding:0 16px; font:inherit; cursor:pointer; }
  aside { background:#fff; border-left:1px solid var(--borde); padding:16px; overflow-y:auto; }
  aside h2 { font-size:15px; margin:0 0 8px; }
  aside p { color:var(--sutil); font-size:13px; }
  .cobro { border:1px solid var(--borde); border-radius:8px; padding:8px; margin-bottom:8px; font-size:13px; }
  .cobro button { margin-top:6px; width:100%; background:#fff3cd; border:1px solid #e0c060; border-radius:6px; padding:6px; cursor:pointer; font:inherit; }
  .sim { background:#fff3cd; color:#7a5b00; padding:6px 8px; border-radius:6px; font-size:12px; font-weight:600; }
</style>
</head>
<body>
<div class="app">
  <main>
    <header>
      <b>Paga Fácil · chat de pruebas</b>
      <label>Tu celular <input id="cel" inputmode="numeric" maxlength="10" placeholder="10 dígitos" /></label>
    </header>
    <div id="chat" aria-live="polite"></div>
    <form id="f"><input id="t" autocomplete="off" placeholder="Escribe un mensaje (prueba: hola)" /><button>Enviar</button></form>
  </main>
  <aside>
    <h2>Cobros pendientes</h2>
    <p>Los cobros son <b>reales</b> en pey: la push llega al celular que escribiste arriba. Paga con $0.01 desde tu banco y espera la confirmación.</p>
    <div class="sim">"Simular pago" = SIMULACIÓN: el comprobante lo dirá.</div>
    <div id="pend" style="margin-top:10px"></div>
  </aside>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const chat = $("#chat");
  let desde = 0;
  const guardado = (() => { try { return localStorage.getItem("cel") || ""; } catch { return ""; } })();
  $("#cel").value = guardado;
  const waId = () => "dev" + ($("#cel").value.replace(/\D/g, "") || "0000000000");
  $("#cel").addEventListener("change", () => {
    try { localStorage.setItem("cel", $("#cel").value); } catch {}
    chat.innerHTML = ""; desde = 0;
  });

  function burbuja(mia) {
    const d = document.createElement("div");
    d.className = "msg" + (mia ? " mia" : "");
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }
  function texto(el, t) {
    // Negritas y cursivas de WhatsApp (*x*, _x_), sin HTML del servidor.
    const esc = t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
    el.innerHTML += esc.replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/(^|\s)_([^_\n]+)_/g, "$1<i>$2</i>");
  }
  function boton(cont, etiqueta, id, clase, detalle) {
    const b = document.createElement("button");
    b.type = "button";
    if (clase) b.className = clase;
    b.textContent = etiqueta;
    if (detalle) { const s = document.createElement("small"); s.textContent = detalle; b.appendChild(s); }
    b.onclick = () => enviar({ id }, etiqueta);
    cont.appendChild(b);
  }
  function pintar(m) {
    const d = burbuja(false);
    if (m.encabezado) { const e = document.createElement("div"); e.className = "enc"; e.textContent = m.encabezado; d.appendChild(e); }
    if (m.tipo === "imagen") {
      const i = document.createElement("img"); i.src = m.dataUrl; i.alt = "QR CoDi"; d.appendChild(i);
      if (m.pie) { const p = document.createElement("div"); p.style.marginTop = "6px"; texto(p, m.pie); d.appendChild(p); }
    } else if (m.tipo === "documento") {
      const a = document.createElement("a"); a.href = m.dataUrl; a.download = m.nombre; a.textContent = "📄 " + m.nombre; a.target = "_blank";
      d.appendChild(a);
      if (m.pie) { const p = document.createElement("div"); p.style.marginTop = "6px"; texto(p, m.pie); d.appendChild(p); }
    } else {
      const c = document.createElement("div"); texto(c, m.cuerpo); d.appendChild(c);
    }
    if (m.pie && m.tipo !== "imagen" && m.tipo !== "documento") { const p = document.createElement("div"); p.className = "pie"; p.textContent = m.pie; d.appendChild(p); }
    if (m.tipo === "botones") {
      const a = document.createElement("div"); a.className = "acciones";
      m.botones.forEach((b) => boton(a, b.titulo, b.id)); d.appendChild(a);
    }
    if (m.tipo === "lista") {
      const a = document.createElement("div"); a.className = "acciones";
      m.secciones.forEach((s) => {
        const t = document.createElement("div"); t.className = "lista-titulo"; t.textContent = s.titulo; a.appendChild(t);
        s.filas.forEach((f) => boton(a, f.titulo, f.id, "fila", f.descripcion));
      });
      d.appendChild(a);
    }
    chat.scrollTop = chat.scrollHeight;
  }
  async function enviar(cuerpo, eco) {
    texto(burbuja(true), eco);
    await fetch("/dev/api/mensaje", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ waId: waId(), ...cuerpo }) });
    await leer();
  }
  async function leer() {
    const r = await fetch(`/dev/api/buzon?waId=${waId()}&desde=${desde}`).then((x) => x.json());
    for (const c of r.mensajes) { pintar(c.mensaje); desde = Math.max(desde, c.n); }
  }
  async function pendientes() {
    const r = await fetch(`/dev/api/pendientes?waId=${waId()}`).then((x) => x.json());
    const p = $("#pend"); p.innerHTML = "";
    if (!r.cobros.length) { p.innerHTML = "<p>Ninguno.</p>"; return; }
    r.cobros.forEach((c) => {
      const d = document.createElement("div"); d.className = "cobro";
      d.textContent = `${c.metodo === "pn" ? "📲 Push" : "📷 QR"} · $${(c.centavos / 100).toFixed(2)} · ${c.concepto}`;
      const b = document.createElement("button"); b.textContent = "Simular pago (SIMULACIÓN)";
      b.onclick = async () => { await fetch(`/dev/api/simular/${c.id}?waId=${waId()}`, { method: "POST" }); leer(); pendientes(); };
      d.appendChild(b); p.appendChild(d);
    });
  }
  $("#f").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = $("#t").value.trim(); if (!t) return;
    $("#t").value = ""; enviar({ texto: t }, t);
  });
  setInterval(() => { leer(); pendientes(); }, 1500);
  leer(); pendientes();
</script>
</body>
</html>
