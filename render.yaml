# Despliegue en Render (plan gratuito): dashboard.render.com → New → Blueprint → este repo.
# Los valores secretos (sync: false) se capturan en el panel de Render, nunca aquí.
services:
  - type: web
    name: paga-facil
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.ts
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_TOOLS
        value: "1"   # deja /dev como plan B de la demo; pon "0" cuando ya no se necesite
      - key: MAX_MONTO_MXN
        value: "1"
      - key: DEMO_COBRO_MXN
        value: "0.01"
      - key: WHATSAPP_GRAPH_VERSION
        value: v27.0
      - key: PEY_API_KEY
        sync: false
      - key: PEY_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
